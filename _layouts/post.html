<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page.title }}</title>
    <style>
        /* Base styles matching the minimal portfolio */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fff;
            color: #000;
            line-height: 1.5;
            padding: 2rem;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        .date {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 1.5rem;
        }
        nav {
            margin-top: 2rem;
            display: flex;
            gap: 1.5rem;
            justify-content: center;
        }
        nav a {
            text-decoration: none;
            color: #0072ce;
            text-transform: lowercase;
        }
        nav a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>{{ page.title }}</h1>
    {% if page.date %}
    <p class="date">{{ page.date | date: "%B %d, %Y" }}</p>
    {% endif %}
    <div class="content">
      {{ content }}
    </div>
    <nav>
        <a href="/">home</a>
        <a href="/blog/">blog</a>
        <a href="/about.html">about</a>
    </nav>
</body>
</html>
