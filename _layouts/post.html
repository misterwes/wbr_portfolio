<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page.title }}</title>
    <!-- Use the shared stylesheet for a consistent look -->
    <link rel="stylesheet" href="/main.css" />
  </head>
  <body>
    <div class="container">
      <!-- Primary navigation appears at the top of each post and page -->
      <nav>
        <a href="/">home</a>
        <a href="/blog/">blog</a>
        <a href="/about.html">about</a>
      </nav>
      <h1>{{ page.title }}</h1>
      {% if page.date %}
      <p class="date">{{ page.date | date: "%B %d, %Y" }}</p>
      {% endif %}
      <div class="content">{{ content }}</div>
    </div>
  </body>
</html>
